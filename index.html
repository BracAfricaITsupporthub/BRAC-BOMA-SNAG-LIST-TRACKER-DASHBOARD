        try {
            baseSnags = JSON.parse(localStorage.getItem('brac_base_snags_v6_sync')) || defaultBaseSnags;
        } catch(e) { baseSnags = defaultBaseSnags; }

        try {
            roomSnags = JSON.parse(localStorage.getItem('brac_room_snags_v6_sync')) || defaultRoomSnags;
        } catch(e) { roomSnags = defaultRoomSnags; }

        if (!baseSnags || baseSnags.length === 0) baseSnags = defaultBaseSnags;
        if (!roomSnags || roomSnags.length === 0) roomSnags = defaultRoomSnags;

        function saveStorage() {
            localStorage.setItem('brac_base_snags_v6_sync', JSON.stringify(baseSnags));
            localStorage.setItem('brac_room_snags_v6_sync', JSON.stringify(roomSnags));
            updateBadges();
        }

        function updateBadges() {
            document.getElementById('badge-base').innerText = baseSnags.length;
            document.getElementById('badge-rooms').innerText = roomSnags.length;

            const allItems = [...baseSnags, ...roomSnags];
            const resolvedCount = allItems.filter(s => s.status === 'Completed' || s.bracConfirmation === 'Confirmed').length;
            const pct = allItems.length === 0 ? 0 : Math.round((resolvedCount / allItems.length) * 100);
            document.getElementById('completion-rate').innerText = pct + "% Resolved";
            document.getElementById('progress-bar').style.width = pct + "%";
        }

        function switchWorkspace(ws) {
            currentWorkspace = ws;
            ['base', 'rooms'].forEach(k => {
                const nav = document.getElementById(`nav-${k}`);
                nav.className = k === ws ?
                    "flex-1 lg:flex-none flex items-center justify-between px-3 sm:px-4 py-3 rounded-xl text-xs font-semibold bg-teal-900 text-white shadow-md transition-all" :
                    "flex-1 lg:flex-none flex items-center justify-between px-3 sm:px-4 py-3 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-white transition-all";
            });
            renderWorkspace();
        }

        function syncToGoogleSheets(payload) {
            if (!APPS_SCRIPT_URL) return;
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).then(() => {
                showToast("Synced to Google Sheet!");
            }).catch(err => {
                console.error("Sync error:", err);
                showToast("Sync warning - check connectivity.");
            });
        }

        function updateBaseItem(idx, field, value) {
            baseSnags[idx][field] = value;
            saveStorage();
            syncToGoogleSheets({
                action: "updateStatus",
                workspace: "base",
                id: baseSnags[idx].id,
                status: baseSnags[idx].status,
                brand: baseSnags[idx].brand,
                contractorStatus: baseSnags[idx].contractorStatus,
                bracConfirmation: baseSnags[idx].bracConfirmation,
                notes: baseSnags[idx].notes
            });
            showToast("Base floor snag updated & synced.");
        }

        function updateRoomItem(idx, field, value) {
            roomSnags[idx][field] = value;
            saveStorage();
            syncToGoogleSheets({
                action: "updateStatus",
                workspace: "rooms",
                id: roomSnags[idx].id,
                status: roomSnags[idx].status,
                brand: roomSnags[idx].brand,
                contractorStatus: roomSnags[idx].contractorStatus,
                bracConfirmation: roomSnags[idx].bracConfirmation,
                notes: roomSnags[idx].notes
            });
            showToast("Room audit item updated & synced.");
        }

        function handlePhotoUpload(workspace, idx, event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const targetList = workspace === 'base' ? baseSnags : roomSnags;
            if (!targetList[idx].photos) targetList[idx].photos = [];

            if (targetList[idx].photos.length >= 3) {
                alert("Maximum limit of 3 photos reached for this item.");
                return;
            }

            for (let i = 0; i < files.length; i++) {
                if (targetList[idx].photos.length >= 3) break;
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    targetList[idx].photos.push(e.target.result);
                    saveStorage();
                    renderWorkspace();
                    showToast("Photo stored locally.");
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto(workspace, idx, photoIdx) {
            if (confirm("Are you sure you want to remove this photo?")) {
                const targetList = workspace === 'base' ? baseSnags : roomSnags;
                targetList[idx].photos.splice(photoIdx, 1);
                saveStorage();
                renderWorkspace();
                showToast("Photo removed.");
            }
        }

        function previewPhoto(id, dataUrl) {
            const modal = document.getElementById('preview-modal');
            const body = document.getElementById('preview-body');
            document.getElementById('preview-title').innerText = `Evidence Preview - ${id}`;

            if (dataUrl.startsWith('data:image')) {
                body.innerHTML = `<img src="${dataUrl}" class="max-h-[380px] object-contain rounded-lg border shadow-sm mx-auto" />`;
            } else {
                body.innerHTML = `<a href="${dataUrl}" download="${id}_Evidence" class="px-4 py-2 bg-teal-900 text-white text-xs rounded-xl shadow">Download Attachment</a>`;
            }
            modal.classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

            const container = document.getElementById('main-content');
            if (currentWorkspace === 'base') {
                renderBaseWorkspace(container);
            } else {
                renderRoomsWorkspace(container);

                                    <th class="p-3 w-32">Zone</th>
                                    <th class="p-3 w-28">Status</th>
                                    <th class="p-3 w-36">Brand / Make</th>
                                    <th class="p-3">ToR Specifications</th>
                                    <th class="p-3 w-16">Pax</th>
                                    <th class="p-3 w-28">Dimensions</th>
                                    <th class="p-3 w-36">BRAC Contentment</th>
                                    <th class="p-3 w-56">Photos (Max 3)</th>
                                    <th class="p-3 pr-5 w-48">BRAC Sign-Off Remarks</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${roomSnags.map((s, idx) => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3 pl-5 font-mono font-bold text-teal-900">${s.id}</td>
                                        <td class="p-3 font-semibold text-slate-900">${s.roomName}</td>
                                        <td class="p-3 text-slate-600">${s.zone}</td>
                                        <td class="p-3">
                                            <select onchange="updateRoomItem(${idx}, 'status', this.value)" class="bg-slate-100 border rounded-lg px-2 py-1 text-xs font-semibold">
                                                <option value="Not Started" ${s.status === 'Not Started' ? 'selected' : ''}>Not Started</option>
                                                <option value="Ongoing" ${s.status === 'Ongoing' ? 'selected' : ''}>Ongoing</option>
                                                <option value="Pending" ${s.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                                <option value="Completed" ${s.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                            </select>
                                        </td>
                                        <td class="p-3"><input type="text" value="${s.brand}" onchange="updateRoomItem(${idx}, 'brand', this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs"></td>
                                        <td class="p-3 text-slate-600 text-[11px]">${s.torSpecs}</td>
                                        <td class="p-3 font-semibold">${s.pax}</td>
                                        <td class="p-3 font-mono text-slate-600">${s.dimensions}</td>
                                        <td class="p-3">
                                            <select onchange="updateRoomItem(${idx}, 'bracConfirmation', this.value)" class="bg-slate-100 border rounded-lg px-2 py-1 text-xs font-semibold">
                                                <option value="Pending Confirmation" ${s.bracConfirmation === 'Pending Confirmation' ? 'selected' : ''}>Pending Confirmation</option>
                                                <option value="Confirmed" ${s.bracConfirmation === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                                <option value="Rejected" ${s.bracConfirmation === 'Rejected' ? 'selected' : ''}>Rejected</option>
                                            </select>
                                        </td>
                                        <td class="p-3">
                                            <div class="space-y-1.5">
                                                <div class="flex items-center space-x-1 flex-wrap">
                                                    ${(s.photos || []).map((p, pIdx) => `
                                                        <div class="relative group inline-flex items-center bg-teal-50 border border-teal-200 rounded px-1.5 py-0.5 text-[11px]">
                                                            <button onclick="previewPhoto('${s.id}', '${p}')" class="text-teal-800 font-semibold hover:underline mr-1"><i class="fa-solid fa-image mr-0.5"></i> #${pIdx+1}</button>
                                                            <button onclick="removePhoto('rooms', ${idx}, ${pIdx})" class="text-rose-600 hover:text-rose-800 font-bold ml-1" title="Remove Photo">&times;</button>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                                ${(!s.photos || s.photos.length < 3) ? `
                                                    <label class="cursor-pointer inline-flex items-center px-2.5 py-1 bg-teal-900 hover:bg-teal-800 text-white rounded text-[11px] font-semibold shadow">
                                                        <i class="fa-solid fa-camera mr-1"></i> Add Photo (${(s.photos || []).length}/3)
                                                        <input type="file" accept="image/*,.pdf" class="hidden" onchange="handlePhotoUpload('rooms', ${idx}, event)">
                                                    </label>
                                                ` : `<span class="text-[10px] text-amber-600 font-semibold">Max 3 photos reached</span>`}
                                            </div>
                                        </td>
                                        <td class="p-3 pr-5"><input type="text" value="${s.notes}" onchange="updateRoomItem(${idx}, 'notes', this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs" placeholder="Add sign-off remark..."></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        saveStorage();
        renderWorkspace();
    </script>
</body>
</html>
